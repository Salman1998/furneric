<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-xl shadow">
  <h2 class="text-2xl font-semibold text-center mb-4">Forgot Password</h2>
  <p class="text-gray-600 text-center mb-6">
    Enter your registered email and we will send you a reset link.
  </p>

  <form #form="ngForm" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Email Address</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-300"
      />
    </div>

    <button
      type="submit"
      class="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
    >
      Send Reset Link
    </button>
  </form>

  <p class="mt-4 text-center text-sm">
    <a routerLink="/auth/login" class="text-blue-600 hover:underline">
      Back to Login
    </a>
  </p>
</div>
