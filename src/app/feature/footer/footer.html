<footer class="bg-[#1f1f1f] text-white py-12">
  <div class="w-full px-4 mx-auto max-w-full">

    <!-- Social Media Icons -->
    <div class="flex justify-between items-start mb-12">
      <div class="flex gap-3">

        @for (icon of socialIcons; track icon) {
          <a
            [href]="icon.url"
            class="p-3 px-3.5 rounded-full border border-white/20 hover:bg-white/10 hover:border-white/40 transition-all duration-300 cursor-pointer group"
            [attr.aria-label]="icon.name"
          >
            <i
              [class]="icon.class + ' w-5 h-5 text-white flex items-center justify-center group-hover:scale-110 transition-transform duration-300'"
            ></i>
          </a>
        }

      </div>

      <div>
        <a
          class="px-5 py-2.5 rounded-full border border-white/60 hover:bg-white hover:text-[#1f1f1f] transition-all duration-300 font-bold text-lg tracking-wide inline-block"
          routerLink="/"
        >
          Furneric
        </a>
      </div>
    </div>

    <!-- Footer Links -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8 mb-12">

      @for (section of (footerLinks | keyvalue); track section.key) {
        <div>
          <h3 class="text-lg font-semibold mb-4 text-white">{{ section.key }}</h3>

          <ul class="space-y-3">

            @for (link of section.value; track link) {
              <li>
                <a class="text-gray-400 hover:text-white hover:pl-2 transition-all duration-300 cursor-pointer inline-block">
                  {{ link }}
                </a>
              </li>
            }

          </ul>
        </div>
      }

    </div>

    <!-- Bottom Border -->
    <div class="w-full h-px bg-linear-to-r from-transparent via-white/30 to-transparent"></div>

    <!-- Copyright -->
    <div class="text-center text-gray-400 text-sm mt-8">
      <p>&copy; {{ currentYear }} Furneric. All rights reserved.</p>
    </div>

  </div>
</footer>
