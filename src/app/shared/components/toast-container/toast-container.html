<div class="fixed top-6 right-6 z-50 flex flex-col gap-3">

  <div
    *ngFor="let msg of toast.messages$ | async"
    class="flex items-center justify-between gap-3 px-4 py-3 rounded-xl shadow-md animate-toast-enter
           min-w-[280px] max-w-sm border-l-4"
    [ngClass]="{
      'bg-green-50': msg.type === 'success',
      'bg-blue-50': msg.type === 'info',
      'bg-yellow-50': msg.type === 'warning',
      'bg-red-50': msg.type === 'error',

      'border-green-500': msg.type === 'success',
      'border-blue-500': msg.type === 'info',
      'border-yellow-500': msg.type === 'warning',
      'border-red-500': msg.type === 'error'
    }"
  >

    <!-- Left Icon -->
    <div
      class="text-xl"
      [ngClass]="{
        'text-green-600': msg.type === 'success',
        'text-blue-600': msg.type === 'info',
        'text-yellow-600': msg.type === 'warning',
        'text-red-600': msg.type === 'error'
      }"
    >
      <i
        class="fa-solid"
        [ngClass]="{
          'fa-check': msg.type === 'success',
          'fa-circle-info': msg.type === 'info',
          'fa-triangle-exclamation': msg.type === 'warning',
          'fa-circle-xmark': msg.type === 'error'
        }"
      ></i>
    </div>

    <!-- Message Text -->
    <p class="flex-1 text-gray-800 font-medium text-sm leading-snug">
      {{ msg.text }}
    </p>

    <!-- Close Button -->
    <button
      (click)="remove(msg.id)"
      class="text-gray-500 hover:text-gray-700 transition"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>

  </div>

</div>
